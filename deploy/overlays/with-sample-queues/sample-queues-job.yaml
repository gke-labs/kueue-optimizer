apiVersion: batch/v1
kind: Job
metadata:
  name: kueue-sample-queues-setup
  labels:
    app.kubernetes.io/component: sample-queues-setup
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sample-queues-setup
        app.kubernetes.io/part-of: kueue-optimizer
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: apply-sample-queues
        image: registry.k8s.io/kubectl:v1.36.4
        imagePullPolicy: IfNotPresent
        args:
        - --kubeconfig=/etc/kubernetes/pki/kubeconfig
        - --cache-dir=/tmp/kube-cache
        - apply
        - --server-side
        - --force-conflicts
        - -f
        - /etc/kueue-samples/sample-queues.yaml
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: pki
          mountPath: /etc/kubernetes/pki
          readOnly: true
        - name: sample-queues
          mountPath: /etc/kueue-samples
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: pki
        secret:
          secretName: kwok-pki
          defaultMode: 0444
      - name: sample-queues
        configMap:
          name: kueue-sample-queues
      - name: tmp
        emptyDir: {}
