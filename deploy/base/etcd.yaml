apiVersion: v1
kind: Service
metadata:
  name: kwok-etcd
  labels:
    app.kubernetes.io/component: etcd
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  selector:
    app.kubernetes.io/component: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
    protocol: TCP
  - name: peer
    port: 2380
    targetPort: 2380
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-etcd
  labels:
    app.kubernetes.io/component: etcd
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/component: etcd
        app.kubernetes.io/part-of: kueue-optimizer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: etcd
        image: registry.k8s.io/etcd:3.6.10-0
        imagePullPolicy: IfNotPresent
        command:
        - etcd
        args:
        - --name=node0
        - --data-dir=/etcd-data
        - --auto-compaction-retention=1
        - --quota-backend-bytes=8589934592
        - --initial-advertise-peer-urls=http://0.0.0.0:2380
        - --listen-peer-urls=http://0.0.0.0:2380
        - --advertise-client-urls=http://kwok-etcd:2379
        - --listen-client-urls=http://0.0.0.0:2379
        - --initial-cluster=node0=http://0.0.0.0:2380
        - --initial-cluster-state=new
        ports:
        - name: client
          containerPort: 2379
          protocol: TCP
        - name: peer
          containerPort: 2380
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 2379
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 2379
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 675m
            memory: 1382Mi
          limits:
            cpu: 5400m
            memory: 11059Mi
        volumeMounts:
        - name: etcd-data
          mountPath: /etcd-data
      volumes:
      - name: etcd-data
        emptyDir: {}
