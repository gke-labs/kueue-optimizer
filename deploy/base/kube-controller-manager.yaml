apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-kube-controller-manager
  labels:
    app.kubernetes.io/component: kube-controller-manager
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kube-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kube-controller-manager
        app.kubernetes.io/part-of: kueue-optimizer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: kube-controller-manager
        image: registry.k8s.io/kube-controller-manager:v1.36.4
        imagePullPolicy: IfNotPresent
        command:
        - kube-controller-manager
        args:
        - --kubeconfig=/etc/kubernetes/pki/kubeconfig
        - --leader-elect=false
        - --bind-address=0.0.0.0
        - --secure-port=10257
        - --authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics
        - --root-ca-file=/etc/kubernetes/pki/ca.crt
        - --service-account-private-key-file=/etc/kubernetes/pki/admin.key
        - --kube-api-qps=5000
        - --kube-api-burst=10000
        - --concurrent-job-syncs=32
        ports:
        - name: https
          containerPort: 10257
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10257
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10257
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 540m
            memory: 691Mi
          limits:
            cpu: 5400m
            memory: 5530Mi
        volumeMounts:
        - name: pki
          mountPath: /etc/kubernetes/pki
          readOnly: true
      volumes:
      - name: pki
        secret:
          secretName: kwok-pki
          defaultMode: 0444
