apiVersion: v1
kind: Service
metadata:
  name: kwok-controller
  labels:
    app.kubernetes.io/component: kwok-controller
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  selector:
    app.kubernetes.io/component: kwok-controller
  ports:
  - name: http
    port: 10247
    targetPort: 10247
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-controller
  labels:
    app.kubernetes.io/component: kwok-controller
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kwok-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kwok-controller
        app.kubernetes.io/part-of: kueue-optimizer
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: apply-kwok-crds
        image: registry.k8s.io/kubectl:v1.36.4
        imagePullPolicy: IfNotPresent
        args:
        - --kubeconfig=/etc/kubernetes/pki/kubeconfig
        - --cache-dir=/tmp/kube-cache
        - apply
        - --server-side
        - --force-conflicts
        - -f
        - /etc/kwok-manifests/crds/kwok-crds.yaml
        volumeMounts:
        - name: pki
          mountPath: /etc/kubernetes/pki
          readOnly: true
        - name: kwok-crds
          mountPath: /etc/kwok-manifests/crds
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - name: wait-kwok-crds
        image: registry.k8s.io/kubectl:v1.36.4
        imagePullPolicy: IfNotPresent
        args:
        - --kubeconfig=/etc/kubernetes/pki/kubeconfig
        - --cache-dir=/tmp/kube-cache
        - wait
        - --for=condition=Established
        - --timeout=120s
        - -f
        - /etc/kwok-manifests/crds/kwok-crds.yaml
        volumeMounts:
        - name: pki
          mountPath: /etc/kubernetes/pki
          readOnly: true
        - name: kwok-crds
          mountPath: /etc/kwok-manifests/crds
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - name: apply-kwok-bootstrap
        image: registry.k8s.io/kubectl:v1.36.4
        imagePullPolicy: IfNotPresent
        args:
        - --kubeconfig=/etc/kubernetes/pki/kubeconfig
        - --cache-dir=/tmp/kube-cache
        - apply
        - --server-side
        - --force-conflicts
        - -f
        - /etc/kwok-manifests/bootstrap/
        volumeMounts:
        - name: pki
          mountPath: /etc/kubernetes/pki
          readOnly: true
        - name: kwok-bootstrap
          mountPath: /etc/kwok-manifests/bootstrap
          readOnly: true
        - name: tmp
          mountPath: /tmp
      containers:
      - name: kwok-controller
        image: registry.k8s.io/kwok/kwok:v0.8.0
        imagePullPolicy: IfNotPresent
        command:
        - kwok
        args:
        - --kubeconfig=/etc/kubernetes/pki/kubeconfig
        - --config=/root/.kwok/kwok.yaml
        - --manage-nodes-with-annotation-selector=kwok.x-k8s.io/node=fake
        - --tls-cert-file=/etc/kubernetes/pki/admin.crt
        - --tls-private-key-file=/etc/kubernetes/pki/admin.key
        - --node-ip=$(POD_IP)
        - --node-name=kwok-controller
        - --node-port=10247
        - --server-address=0.0.0.0:10247
        - --node-lease-duration-seconds=40
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: http
          containerPort: 10247
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10247
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10247
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 540m
            memory: 691Mi
          limits:
            cpu: 5400m
            memory: 5530Mi
        volumeMounts:
        - name: pki
          mountPath: /etc/kubernetes/pki
          readOnly: true
        - name: kwok-config
          mountPath: /root/.kwok/kwok.yaml
          subPath: kwok.yaml
          readOnly: true
      volumes:
      - name: pki
        secret:
          secretName: kwok-pki
          defaultMode: 0444
      - name: kwok-config
        configMap:
          name: kwok-config
      - name: kwok-crds
        configMap:
          name: kwok-crds
      - name: kwok-bootstrap
        configMap:
          name: kwok-bootstrap
      - name: tmp
        emptyDir: {}
