apiVersion: v1
kind: Service
metadata:
  name: kwok-registry
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/name: kwok-registry
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: registry
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30500
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/name: kwok-registry
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  selector:
    app.kubernetes.io/component: registry
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-registry
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/name: kwok-registry
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: registry
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: registry
      labels:
        app.kubernetes.io/component: registry
        app.kubernetes.io/name: kwok-registry
        app.kubernetes.io/part-of: kueue-optimizer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: registry
        image: mirror.gcr.io/library/registry:2
        imagePullPolicy: IfNotPresent
        env:
        - name: REGISTRY_HTTP_ADDR
          value: 0.0.0.0:5000
        - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
          value: /var/lib/registry
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        - name: OTEL_TRACES_EXPORTER
          value: none
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /v2/
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /v2/
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 270m
            memory: 691Mi
          limits:
            cpu: 2700m
            memory: 11059Mi
        volumeMounts:
        - name: storage
          mountPath: /var/lib/registry
      volumes:
      - name: storage
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
