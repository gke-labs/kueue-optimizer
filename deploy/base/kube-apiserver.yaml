apiVersion: v1
kind: Service
metadata:
  name: kwok-kube-apiserver
  labels:
    app.kubernetes.io/component: kube-apiserver
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  selector:
    app.kubernetes.io/component: kube-apiserver
  ports:
  - name: https
    port: 6443
    targetPort: 6443
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-kube-apiserver
  labels:
    app.kubernetes.io/component: kube-apiserver
    app.kubernetes.io/part-of: kueue-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: kube-apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kube-apiserver
        app.kubernetes.io/part-of: kueue-optimizer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: kube-apiserver
        image: registry.k8s.io/kube-apiserver:v1.36.4
        imagePullPolicy: IfNotPresent
        command:
        - kube-apiserver
        args:
        - --etcd-prefix=/registry
        - --etcd-servers=http://kwok-etcd:2379
        - --allow-privileged=true
        - --endpoint-reconciler-type=none
        - --bind-address=0.0.0.0
        - --secure-port=6443
        - --authorization-mode=Node,RBAC
        - --tls-cert-file=/etc/kubernetes/pki/admin.crt
        - --tls-private-key-file=/etc/kubernetes/pki/admin.key
        - --client-ca-file=/etc/kubernetes/pki/ca.crt
        - --token-auth-file=/etc/kubernetes/pki/token.csv
        - --service-account-key-file=/etc/kubernetes/pki/admin.key
        - --service-account-signing-key-file=/etc/kubernetes/pki/admin.key
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --proxy-client-key-file=/etc/kubernetes/pki/admin.key
        - --proxy-client-cert-file=/etc/kubernetes/pki/admin.crt
        - --requestheader-client-ca-file=/etc/kubernetes/pki/ca.crt
        - --requestheader-allowed-names=kwok-ca,kwok-admin
        - --requestheader-username-headers=X-Remote-User
        - --requestheader-group-headers=X-Remote-Group
        - --requestheader-extra-headers-prefix=X-Remote-Extra-
        - --max-requests-inflight=0
        - --max-mutating-requests-inflight=0
        - --enable-priority-and-fairness=false
        env:
        - name: GOMEMLIMIT
          value: 7GiB
        ports:
        - name: https
          containerPort: 6443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 6443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /livez
            port: 6443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 1350m
            memory: 2765Mi
          limits:
            cpu: "7"
            memory: 21Gi
        volumeMounts:
        - name: pki
          mountPath: /etc/kubernetes/pki
          readOnly: true
      volumes:
      - name: pki
        secret:
          secretName: kwok-pki
          defaultMode: 0444
