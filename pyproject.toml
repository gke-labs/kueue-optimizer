# Lint configuration for the stdlib-only Python tooling under deploy/scripts/.
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["deploy/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: the scenario README renderer and the metrics tests carry long table / f-string lines that predate this config.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests put deploy/scripts on sys.path before importing the scripts under test.
"deploy/scripts/test_*.py" = ["E402"]
